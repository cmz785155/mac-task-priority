name: Build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test.sh
      - run: ./scripts/build.sh
      - run: codesign --verify --deep --strict dist/release/Mac任务优先级.app
      - run: ditto -c -k --sequesterRsrc --keepParent dist/release/Mac任务优先级.app dist/MacTaskPriority-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacTaskPriority-arm64
          path: dist/MacTaskPriority-arm64.zip
